# Persona Nexus — same-origin stack
#
# Frontends are NOT containers. They are built on the host (npm run build in
# each persona-nexus-* project) and their dist/ folders are mounted read-only
# into Caddy, which serves them directly. See deploy/README.md.
#
# Prerequisite: every service below needs a Dockerfile in its project root.

services:
  # Single public entry point: static frontends + /api/* reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: nexus-caddy
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      # Pre-built frontend bundles (run npm run build on the host first)
      - ../persona-nexus-lobby/dist:/srv/lobby:ro
      - ../persona-nexus-auth/dist:/srv/auth:ro
      - ../persona-nexus-character/dist:/srv/character:ro
      - ../persona-nexus-chat/dist:/srv/chat:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - nexus-network
    depends_on:
      - gateway
    restart: unless-stopped

  # API Gateway — the only backend Caddy talks to
  gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: nexus-gateway
    environment:
      NODE_ENV: production
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Internal upstreams use compose service names (Docker DNS), never localhost
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      CHARACTER_SERVICE_URL: http://character-service:3003
      CHAT_SERVICE_URL: http://chat-service:3004
      AI_SERVICE_URL: http://ai-service:3005
      # Same-origin: the browser only ever talks to Caddy's origin
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    networks:
      - nexus-network
    depends_on:
      - auth-service
      - user-service
      - character-service
      - chat-service
    restart: unless-stopped

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: nexus-auth-service
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    networks:
      - nexus-network
    restart: unless-stopped

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: nexus-user-service
    environment:
      NODE_ENV: production
      PORT: 3002
    networks:
      - nexus-network
    restart: unless-stopped

  character-service:
    build:
      context: ../character-service
      dockerfile: Dockerfile
    container_name: nexus-character-service
    environment:
      NODE_ENV: production
      PORT: 3003
    networks:
      - nexus-network
    restart: unless-stopped

  chat-service:
    build:
      context: ../chat-service
      dockerfile: Dockerfile
    container_name: nexus-chat-service
    environment:
      NODE_ENV: production
      PORT: 3004
    networks:
      - nexus-network
    restart: unless-stopped

  # ai-service binds a local GPU today; see ARCHITECTURE.md before containerizing.
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: nexus-ai-service
    environment:
      NODE_ENV: production
      PORT: 3005
    networks:
      - nexus-network
    restart: unless-stopped
    # GPU passthrough (uncomment when the host exposes an NVIDIA runtime):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  nexus-network:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
