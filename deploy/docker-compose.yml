# Persona Nexus — same-origin stack
#
# Frontends are NOT containers. They are built on the host (npm run build in
# each persona-nexus-* project) and their dist/ folders are mounted read-only
# into Caddy, which serves them directly. See deploy/README.md.
#
# Prerequisite: every service below needs a Dockerfile in its project root.

services:
  # Single public entry point: static frontends + /api/* reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: nexus-caddy
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      # Pre-built frontend bundles (run npm run build on the host first)
      - ../persona-nexus-lobby/dist:/srv/lobby:ro
      - ../persona-nexus-auth/dist:/srv/auth:ro
      - ../persona-nexus-character/dist:/srv/character:ro
      - ../persona-nexus-chat/dist:/srv/chat:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - nexus-network
    depends_on:
      - gateway
    restart: unless-stopped

  # API Gateway — the only backend Caddy talks to
  gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: nexus-gateway
    environment:
      NODE_ENV: production
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Internal upstreams use compose service names (Docker DNS), never localhost.
      # Ports match what each service actually listens on — do not renumber here.
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:4000
      CHARACTER_SERVICE_URL: http://character-service:5000
      CHAT_SERVICE_URL: http://chat-service:6000
      AI_SERVICE_URL: http://ai-service:6001
      # FRONTEND_ORIGIN is deliberately unset: the browser reaches this gateway
      # through Caddy on the same origin, so CORS is neither needed nor enabled.
    networks:
      - nexus-network
    depends_on:
      - auth-service
      - user-service
      - character-service
      - chat-service
    restart: unless-stopped

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: nexus-auth-service
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    networks:
      - nexus-network
    restart: unless-stopped

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: nexus-user-service
    environment:
      NODE_ENV: production
      PORT: 4000
    networks:
      - nexus-network
    restart: unless-stopped

  character-service:
    build:
      context: ../character-service
      dockerfile: Dockerfile
    container_name: nexus-character-service
    environment:
      NODE_ENV: production
      PORT: 5000
    networks:
      - nexus-network
    restart: unless-stopped

  chat-service:
    build:
      context: ../chat-service
      dockerfile: Dockerfile
    container_name: nexus-chat-service
    environment:
      NODE_ENV: production
      PORT: 6000
    networks:
      - nexus-network
    restart: unless-stopped

  # ai-service is Python/FastAPI (uvicorn, main.py) — not Node — and additionally
  # depends on Ollama (11434) and Qdrant (6333), which are NOT defined here yet.
  # It also binds a local GPU today; see ARCHITECTURE.md before containerizing.
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: nexus-ai-service
    environment:
      PORT: 6001
    networks:
      - nexus-network
    restart: unless-stopped
    # GPU passthrough (uncomment when the host exposes an NVIDIA runtime):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  nexus-network:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
